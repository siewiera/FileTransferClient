<div class="register-page">

  <div
    #registerCard
    class="register-card"
    (mousemove)="onMouseMove($event)"
    /* (mouseleave)="onMouseLeave()" */
  >

    <div class="glass-reflection"></div>


    <!-- HEADER -->
    <div class="register-card__header">

      <h1>
        Utwórz konto
      </h1>

      <p>
        Zarejestruj się, aby rozpocząć
      </p>

    </div>


    <!-- FORM -->
    <form
      class="register-form"
      (ngSubmit)="register()"
    >


      <!-- USERNAME -->
      <div class="form-field">

        <label for="username">
          Nazwa użytkownika
        </label>

        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          placeholder="twoja_nazwa"
          autocomplete="username"
        />

      </div>


      <!-- EMAIL -->
      <div class="form-field">

        <label for="email">
          Adres e-mail
        </label>

        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="twoj@email.pl"
          autocomplete="email"
        />

      </div>


      <!-- PASSWORD -->
      <div class="form-field">

        <label for="password">
          Hasło
        </label>

        <div class="password-wrapper">

          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            autocomplete="new-password"
          />


          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Ukryj hasło' : 'Pokaż hasło'"
            [attr.title]="showPassword ? 'Ukryj hasło' : 'Pokaż hasło'"
          >

            <span class="sr-only">
              {{ showPassword ? 'Ukryj hasło' : 'Pokaż hasło' }}
            </span>


            @if (!showPassword) {

              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >

                <path
                  d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                />

                <circle
                  cx="12"
                  cy="12"
                  r="3"
                />

              </svg>

            } @else {

              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >

                <path d="M3 3l18 18" />

                <path
                  d="M10.6 6.2A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a17.4 17.4 0 0 1-3.1 3.9"
                />

                <path
                  d="M6.2 6.2C3.5 8.2 2 12 2 12s3.5 6 10 6a10 10 0 0 0 3.4-.6"
                />

                <path
                  d="M9.9 9.9a3 3 0 0 0 4.2 4.2"
                />

              </svg>

            }

          </button>

        </div>

      </div>


      <!-- CONFIRM PASSWORD -->
      <div class="form-field">

        <label for="confirmPassword">
          Powtórz hasło
        </label>

        <div class="password-wrapper">

          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="passwordRepeated"
            name="passwordRepeated"
            [(ngModel)]="passwordRepeated"
            placeholder="••••••••"
            autocomplete="new-password"
          />


          <button
            type="button"
            class="password-toggle"
            (click)="toggleConfirmPassword()"
            [attr.aria-label]="showConfirmPassword ? 'Ukryj hasło' : 'Pokaż hasło'"
            [attr.title]="showConfirmPassword ? 'Ukryj hasło' : 'Pokaż hasło'"
          >

            <span class="sr-only">
              {{ showConfirmPassword ? 'Ukryj hasło' : 'Pokaż hasło' }}
            </span>


            @if (!showConfirmPassword) {

              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >

                <path
                  d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                />

                <circle
                  cx="12"
                  cy="12"
                  r="3"
                />

              </svg>

            } @else {

              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >

                <path d="M3 3l18 18" />

                <path
                  d="M10.6 6.2A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a17.4 17.4 0 0 1-3.1 3.9"
                />

                <path
                  d="M6.2 6.2C3.5 8.2 2 12 2 12s3.5 6 10 6a10 10 0 0 0 3.4-.6"
                />

                <path
                  d="M9.9 9.9a3 3 0 0 0 4.2 4.2"
                />

              </svg>

            }

          </button>

        </div>

      </div>


      <!-- TERMS -->
      <label class="terms">

        <input
          type="checkbox"
          name="termsAccepted"
          [(ngModel)]="termsAccepted"
        />

        <span>
          Akceptuję
          <a href="#">
            regulamin
          </a>
          i
          <a href="#">
            politykę prywatności
          </a>
        </span>

      </label>


      <!-- SUBMIT -->
      <button
        type="submit"
        class="register-button"
        title="Utwórz konto"
      >
        Utwórz konto
      </button>

    </form>


    <!-- FOOTER -->
    <div class="register-card__footer">

      <span>
        Masz już konto?
      </span>

      <a routerLink="/login">
        Zaloguj się
      </a>

    </div>

  </div>

</div>
