<h2>Logowanie</h2>


<input
  type="text"
  placeholder="Login"
  [(ngModel)]="username">


<input
  type="password"
  placeholder="Hasło"
  [(ngModel)]="password">

<br>
<br>
<button (click)="login()">
  Zaloguj
</button>
<br>
<br>
<a routerLink="/register">
  Nie masz konta? Zarejestruj się
</a>

<p>
  DEBUG: {{ showActivationLink }}
</p>

@if (showActivationLink) {
  <div class="activation-hint">
    <span>Twoje konto nie zostało jeszcze aktywowane.</span>

    <button
      type="button"
      class="activation-link"
      (click)="goToActivation()">
      Wyślij nowy kod aktywacyjny
    </button>
  </div>
}
