<div class="login-page">

  <div
    #loginCard
    class="login-card"
    (mousemove)="onMouseMove($event)"
    /* (mouseleave)="onMouseLeave()" */
  >

    <div class="glass-reflection"></div>

    <div class="login-card__header">
      <h1>Witaj ponownie</h1>
      <p>Zaloguj się do swojego konta</p>
    </div>

    <form class="login-form" (ngSubmit)="login()">

      <div class="form-field">
        <label for="username">Nazwa użytkownika</label>

        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          placeholder="twoja_nazwa"
          autocomplete="username"
        />
      </div>

      <div class="form-field">
        <label for="password">Hasło</label>

        <div class="password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />

          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Ukryj hasło' : 'Pokaż hasło'"
            [attr.title]="showPassword ? 'Ukryj hasło' : 'Pokaż hasło'"
          >
            <span class="sr-only">
              {{ showPassword ? 'Ukryj hasło' : 'Pokaż hasło' }}
            </span>

            @if (!showPassword) {
              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            } @else {
              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M3 3l18 18" />
                <path d="M10.6 6.2A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a17.4 17.4 0 0 1-3.1 3.9" />
                <path d="M6.2 6.2C3.5 8.2 2 12 2 12s3.5 6 10 6a10 10 0 0 0 3.4-.6" />
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
              </svg>
            }
          </button>
        </div>
      </div>

      <div class="login-options">

        <label class="remember-me">
          <input
            type="checkbox"
            name="rememberMe"
            [(ngModel)]="rememberMe"
          />

          <span>Zapamiętaj mnie</span>
        </label>

        <a href="#" class="forgot-password">
          Zapomniałeś hasła?
        </a>
      </div>
      @if (showActivationLink()) {
        <div class="activation-hint">
          <div class="activation-hint__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 3a9 9 0 1 0 9 9" />
              <path d="M12 7v5l3 2" />
              <path d="M16 3h5v5" />
            </svg>
          </div>

          <div class="activation-hint__content">
            <span class="activation-hint__title">
              Konto wymaga aktywacji
            </span>

            <span class="activation-hint__text">
              Twoje konto nie zostało jeszcze aktywowane.
              Możesz wysłać nowy kod aktywacyjny.
            </span>

            <button
              type="button"
              class="activation-link"
              (click)="goToActivation()"
            >
              Wyślij nowy kod aktywacyjny
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14" />
                <path d="m13 6 6 6-6 6" />
              </svg>
            </button>
          </div>
        </div>
      }

      <button
        type="submit"
        class="login-button"
        title="Zaloguj się"
      >
        Zaloguj się
      </button>

    </form>

    <div class="login-card__footer">
      <span>Nie masz jeszcze konta?</span>
      <a routerLink="/register">Zarejestruj się</a>
    </div>

  </div>

</div>
