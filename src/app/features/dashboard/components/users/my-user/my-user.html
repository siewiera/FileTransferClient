<div class="my-user">
  @if (myUser()) {
    <div class="user-info">
      <span class="username">
        {{ myUser()?.username }}
      </span>

      <span class="role">
        @if (isAdmin()) {
          Administrator
        } @else {
          Użytkownik
        }
      </span>
    </div>
  }
</div>
